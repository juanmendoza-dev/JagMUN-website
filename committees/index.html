<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Committees — JAGMUN III</title>
<link rel="icon" type="image/png" href="../assets/jagmun-logo.png" />

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
html, body { background: #000; }
body { font-family: 'Barlow', sans-serif; }
.rounded { border-radius: 9999px !important; }

/* ===== Liquid glass ===== */
.liquid-glass { background: rgba(255,255,255,0.01); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: none; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1); position: relative; overflow: hidden; }
.liquid-glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; background: linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.liquid-glass-strong { background: rgba(255,255,255,0.01); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); border: none; box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15); position: relative; overflow: hidden; }
.liquid-glass-strong::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; background: linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.2) 80%,rgba(255,255,255,0.5) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }

/* ===== RGB hover ===== */
@property --rgb-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.rgb-hover { position: relative; }
.rgb-hover::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; background: conic-gradient(from var(--rgb-angle),#ff3b8b,#ff8a3d,#ffd166,#6dd76a,#4cc9f0,#8b5cf6,#ff3b8b); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity 0.35s ease; pointer-events: none; z-index: 2; }
.rgb-hover:hover::after { opacity: 1; animation: rgb-spin 3.2s linear infinite; }
.rgb-hover:hover { box-shadow: 0 0 22px 2px rgba(140,100,255,0.18),0 0 36px 8px rgba(255,120,180,0.10); }
@keyframes rgb-spin { to { --rgb-angle: 360deg; } }

/* ===== Nav ===== */
.nav-trigger { position: relative; }
.nav-trigger > .caret { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-right: 1.2px solid currentColor; border-bottom: 1.2px solid currentColor; transform: translateY(-2px) rotate(45deg); opacity: 0.55; transition: transform 260ms cubic-bezier(0.22,1,0.36,1), opacity 200ms ease; }
.nav-trigger.is-open > .caret { transform: translateY(0) rotate(225deg); opacity: 1; }
.nav-dropdown { position: absolute; top: 100%; padding: 14px 8px 8px; pointer-events: none; visibility: hidden; transform: translate3d(-50%,-4px,0); opacity: 0; transition: opacity 220ms cubic-bezier(0.4,0,0.2,1), transform 280ms cubic-bezier(0.22,1,0.36,1), visibility 0s linear 280ms; z-index: 60; will-change: transform, opacity; backface-visibility: hidden; }
.nav-dropdown.is-open { opacity: 1; visibility: visible; pointer-events: auto; transform: translate3d(-50%,0,0); transition: opacity 220ms cubic-bezier(0.4,0,0.2,1), transform 280ms cubic-bezier(0.22,1,0.36,1), visibility 0s linear 0s; }
.nav-dropdown-card { position: relative; min-width: 220px; padding: 6px; border-radius: 16px; background: rgba(20,20,22,0.72); box-shadow: inset 0 1px 1px rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.45),0 2px 6px rgba(0,0,0,0.25); overflow: hidden; transform: translateZ(0); }
.nav-dropdown.is-open .nav-dropdown-card { background: rgba(20,20,22,0.42); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); }
.nav-dropdown-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px; background: linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.18) 25%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.18) 80%,rgba(255,255,255,0.5) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.nav-dropdown-item { position: relative; display: block; padding: 9px 16px; border-radius: 10px; font-family: 'Barlow', sans-serif; font-size: 11.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.72); text-decoration: none; white-space: nowrap; overflow: hidden; opacity: 0; transform: translate3d(-6px,0,0); transition: background-color 180ms ease, color 180ms ease, opacity 280ms ease, transform 320ms cubic-bezier(0.22,1,0.36,1); will-change: transform, opacity; }
.nav-dropdown.is-open .nav-dropdown-item { opacity: 1; transform: translate3d(0,0,0); }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(1) { transition-delay: 40ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(2) { transition-delay: 90ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(3) { transition-delay: 140ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(4) { transition-delay: 190ms; }
.nav-dropdown-item > span.lbl { display: inline-block; transform: translateX(0); transition: transform 220ms cubic-bezier(0.22,1,0.36,1); will-change: transform; }
.nav-dropdown-item:hover > span.lbl { transform: translateX(6px); }
.nav-dropdown-item::after { content: ""; position: absolute; left: 8px; top: 50%; transform: translate3d(0,-50%,0) scaleY(0.2); width: 2px; height: 14px; border-radius: 2px; background: #D4A853; opacity: 0; transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22,1,0.36,1); box-shadow: 0 0 8px rgba(212,168,83,0.55); }
.nav-dropdown-item:hover { color: #fff; background-color: rgba(255,255,255,0.06); }
.nav-dropdown-item:hover::after { opacity: 1; transform: translate3d(0,-50%,0) scaleY(1); }

/* ===== Mobile nav ===== */
.nav-desktop-items { display: flex; align-items: center; gap: 20px; }
.mob-hamburger { display: none; flex-direction: column; justify-content: center; align-items: center; gap: 5.5px; width: 32px; height: 32px; background: none; border: none; padding: 0; cursor: pointer; color: rgba(255,255,255,0.85); z-index: 60; flex-shrink: 0; }
.mob-bar { width: 18px; height: 1.4px; background: currentColor; border-radius: 2px; transition: transform 320ms cubic-bezier(0.22,1,0.36,1), opacity 220ms ease, width 220ms ease; transform-origin: center; }
.mob-hamburger.is-open .mob-bar:nth-child(1) { transform: translateY(6.9px) rotate(45deg); }
.mob-hamburger.is-open .mob-bar:nth-child(2) { opacity: 0; width: 0; }
.mob-hamburger.is-open .mob-bar:nth-child(3) { transform: translateY(-6.9px) rotate(-45deg); }
@media (max-width: 767px) { .nav-desktop-items { display: none !important; } .mob-hamburger { display: flex; } }
.mob-menu { position: fixed; inset: 0; z-index: 48; background: rgba(4,4,6,0.97); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); display: flex; flex-direction: column; padding: 110px 36px 52px; opacity: 0; pointer-events: none; transform: translateY(-8px); transition: opacity 320ms cubic-bezier(0.4,0,0.2,1), transform 380ms cubic-bezier(0.22,1,0.36,1); overflow-y: auto; }
.mob-menu.is-open { opacity: 1; pointer-events: auto; transform: none; }
.mob-menu-group { margin-bottom: 32px; }
.mob-menu-group-label { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #D4A853; margin: 0 0 14px; opacity: 0.85; }
.mob-menu-link { display: block; font-family: 'Instrument Serif', serif; font-style: italic; font-size: clamp(26px,6.5vw,40px); color: rgba(245,239,231,0.75); text-decoration: none; line-height: 1.25; margin-bottom: 2px; opacity: 0; transform: translateX(-14px); transition: opacity 380ms cubic-bezier(0.22,1,0.36,1), transform 420ms cubic-bezier(0.22,1,0.36,1), color 200ms ease; }
.mob-menu.is-open .mob-menu-link { opacity: 1; transform: none; }
.mob-menu-link:hover { color: #F5EFE7; }
.mob-menu-rule { width: 100%; height: 1px; border: 0; background: rgba(245,239,231,0.07); margin: 4px 0 32px; }
.mob-menu-bottom { margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 16px; opacity: 0; transform: translateY(8px); transition: opacity 400ms ease, transform 400ms cubic-bezier(0.22,1,0.36,1); }
.mob-menu.is-open .mob-menu-bottom { opacity: 1; transform: none; }

/* ===== Reveal ===== */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.95s cubic-bezier(0.22,1,0.36,1), transform 0.95s cubic-bezier(0.22,1,0.36,1); }
.reveal.in-view { opacity: 1; transform: none; }

/* ===== Footer ===== */
.site-footer { position: relative; z-index: 10; background: radial-gradient(120% 80% at 50% 120%,rgba(212,168,83,0.08) 0%,rgba(212,168,83,0) 55%),linear-gradient(180deg,#0a0b0f 0%,#050506 100%); padding: clamp(72px,11vh,130px) 24px clamp(44px,6vh,70px); text-align: center; overflow: hidden; }
.footer-rule { width: min(560px,70%); height: 1px; margin: 0 auto clamp(40px,6vh,64px); border: 0; background: linear-gradient(90deg,rgba(245,239,231,0) 0%,rgba(245,239,231,0.22) 50%,rgba(245,239,231,0) 100%); }
.footer-contact { font-family: 'Barlow', sans-serif; font-weight: 500; font-size: clamp(12.5px,1vw,15px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,239,231,0.62); margin: 0 0 clamp(26px,5vh,54px); text-wrap: balance; }
.footer-email { color: #D4A853; text-decoration: none; border-bottom: 1px solid rgba(212,168,83,0.35); padding-bottom: 1px; transition: color 0.22s ease, border-color 0.22s ease; white-space: nowrap; }
.footer-email:hover { color: #F5EFE7; border-color: rgba(245,239,231,0.6); }
.footer-wordmark { font-family: 'Instrument Serif', serif; font-style: italic; font-size: clamp(84px,19vw,300px); line-height: 0.86; letter-spacing: -0.02em; color: #F5EFE7; margin: 0; user-select: none; text-shadow: 0 2px 40px rgba(0,0,0,0.4); }
.footer-ig { display: inline-flex; margin-top: clamp(28px,4vh,48px); color: rgba(245,239,231,0.55); transition: color 0.22s ease, transform 0.22s ease; }
.footer-ig:hover { color: #fff; transform: translateY(-2px); }
.footer-fine { font-family: 'Barlow', sans-serif; font-weight: 400; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(245,239,231,0.32); margin: clamp(34px,5vh,52px) 0 0; }

/* ===== Tier overrides ===== */
.tier-low .liquid-glass { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(18,18,18,0.90) !important; }
.tier-low .liquid-glass-strong { backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important; }
.tier-low .nav-dropdown.is-open .nav-dropdown-card { backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important; }
.tier-low .rgb-hover::after { display: none !important; }
.tier-low .reveal { transition-duration: 0.4s !important; }
.tier-mid .liquid-glass { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tier-mid .liquid-glass-strong { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.tier-mid .rgb-hover:hover::after { animation: rgb-spin 5s linear infinite; }
@media (prefers-reduced-motion: reduce) { .reveal { transition: none !important; opacity: 1 !important; transform: none !important; } .rgb-hover::after { display: none !important; } }

/* ===== Hero ===== */
.sec-hero { position: relative; min-height: 72vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(140px,22vh,240px) 24px clamp(80px,12vh,140px); overflow: hidden; background: #000; text-align: center; }
.sec-hero-orb { position: absolute; top: -15%; left: 50%; transform: translateX(-50%); width: min(960px,160vw); height: min(720px,130vw); background: radial-gradient(ellipse at 50% 28%, rgba(212,168,83,0.17) 0%, rgba(212,168,83,0.07) 38%, transparent 65%); animation: orb-breathe 7s ease-in-out infinite; pointer-events: none; z-index: 0; }
@keyframes orb-breathe { 0%,100% { opacity: 0.7; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.1); } }
.sec-hero-particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.sec-hero-particle { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #D4A853; animation: particle-drift var(--pdur,8s) ease-in-out var(--pdel,0s) infinite; opacity: 0; }
@keyframes particle-drift { 0% { opacity:0; transform:translateY(0) translateX(0) scale(0.5); } 15% { opacity:var(--pop,0.5); } 50% { opacity:var(--pop,0.5); transform:translateY(calc(var(--py)*-1px)) translateX(calc(var(--px)*1px)) scale(1); } 85% { opacity:var(--pop,0.5); } 100% { opacity:0; transform:translateY(calc(var(--py)*-2px)) translateX(calc(var(--px)*0.5px)) scale(0.5); } }
.sec-hero-eyebrow { font-family:'Barlow',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:#D4A853; margin:0 0 20px; position:relative; z-index:2; opacity:0; animation:hero-fade-up 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s forwards; }
.sec-hero-eyebrow::before { content:"\2726"; margin-right:0.9em; font-size:0.78em; }
.sec-hero-eyebrow::after  { content:"\2726"; margin-left:0.9em;  font-size:0.78em; }
.sec-hero-title { font-family:'Instrument Serif',serif; font-style:italic; font-size:clamp(72px,14vw,210px); line-height:0.9; letter-spacing:-0.02em; color:#F5EFE7; margin:0; position:relative; z-index:2; opacity:0; animation:hero-fade-up 1.1s cubic-bezier(0.22,1,0.36,1) 0.45s forwards; }
.sec-hero-sub { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(13px,1.05vw,16px); color:rgba(245,239,231,0.44); margin:24px 0 0; letter-spacing:0.16em; text-transform:uppercase; position:relative; z-index:2; opacity:0; animation:hero-fade-up 1s cubic-bezier(0.22,1,0.36,1) 0.7s forwards; }
.sec-hero-line { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:min(600px,80%); height:1px; background:linear-gradient(90deg,transparent,rgba(212,168,83,0.4),transparent); }
@keyframes hero-fade-up { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }

/* ===== Grid section ===== */
.grid-section {
  position: relative;
  z-index: 10;
  background: linear-gradient(180deg, #050507 0%, #0a0b0f 100%);
  padding: clamp(72px,11vh,120px) 24px clamp(80px,12vh,140px);
}
.grid-section::before {
  content: "";
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: min(700px,90%); height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,168,83,0.35), transparent);
}
.grid-inner { max-width: 1080px; margin: 0 auto; }

.grid-section-label {
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  font-size: 10.5px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #D4A853;
  opacity: 0.8;
  margin: 0 0 clamp(22px,3.5vh,32px);
  scroll-margin-top: 120px;
}
.grid-section-label::before { content: "\2726"; margin-right: 0.8em; font-size: 0.78em; }
.grid-section-label::after  { content: "\2726"; margin-left:  0.8em; font-size: 0.78em; }

.committee-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(14px, 2vw, 24px);
  margin-bottom: clamp(52px, 8vh, 90px);
}
@media (max-width: 640px) {
  /* Single-column card grid */
  .committee-grid { grid-template-columns: 1fr; gap: 12px; }

  /* Landscape cards on mobile — compact banners instead of tall posters */
  .committee-card { aspect-ratio: 3 / 2; }

  /* Bottom-sheet modal */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal-panel {
    border-radius: 20px 20px 0 0;
    max-width: 100%;
    max-height: min(92svh, 92vh);
  }
  .modal-img-wrap {
    border-radius: 20px 20px 0 0;
    aspect-ratio: 16 / 7;
  }

  /* Pull-handle indicator at top of sheet */
  .modal-panel::after {
    content: "";
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.2);
    z-index: 5;
    pointer-events: none;
  }
}

/* ===== Committee card ===== */
.committee-card {
  position: relative;
  aspect-ratio: 4 / 5;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.07);
  transition: transform 0.42s cubic-bezier(0.22,1,0.36,1),
              box-shadow 0.42s ease,
              border-color 0.42s ease;
  outline: none;
}
.committee-card:hover, .committee-card:focus-visible {
  transform: translateY(-8px) scale(1.015);
  box-shadow: 0 32px 80px rgba(0,0,0,0.65), 0 0 60px rgba(212,168,83,0.11);
  border-color: rgba(212,168,83,0.22);
}
.committee-card:active { transform: translateY(-4px) scale(1.008); }

/* Card background (image placeholder) */
.card-bg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-ghost {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(80px, 14vw, 180px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: rgba(212,168,83,0.07);
  user-select: none;
  position: relative; z-index: 1;
  transition: transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease;
}
.committee-card:hover .card-ghost {
  transform: scale(1.06) translateY(-4%);
  opacity: 0.9;
}
.card-shine {
  position: absolute;
  top: -60%; bottom: -60%;
  left: -50%; width: 45%;
  background: linear-gradient(90deg, transparent, rgba(212,168,83,0.055), transparent);
  transform: skewX(-16deg);
  animation: shine-sweep 5s ease-in-out infinite;
  pointer-events: none; z-index: 2;
}
@keyframes shine-sweep { 0% { left: -60%; } 100% { left: 160%; } }

/* Bottom gradient overlay */
.card-gradient {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 70%;
  background: linear-gradient(to top,
    rgba(4,4,6,0.96) 0%,
    rgba(4,4,6,0.72) 35%,
    rgba(4,4,6,0.2) 65%,
    transparent 100%);
  z-index: 3;
  transition: height 0.42s ease;
}
.committee-card:hover .card-gradient {
  height: 75%;
}

/* Expand icon — top right, fades in on hover */
.card-expand {
  position: absolute;
  top: clamp(12px,1.8vw,18px);
  right: clamp(12px,1.8vw,18px);
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.7);
  opacity: 0;
  transform: scale(0.75) rotate(-8deg);
  transition: opacity 0.32s ease, transform 0.38s cubic-bezier(0.22,1,0.36,1), background 0.22s ease;
  z-index: 5;
}
.committee-card:hover .card-expand, .committee-card:focus-visible .card-expand {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}
.committee-card:hover .card-expand { background: rgba(255,255,255,0.12); }

/* Card footer */
.card-footer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: clamp(18px,3vw,28px);
  z-index: 4;
}
.card-type {
  display: block;
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #D4A853;
  opacity: 0.85;
  margin: 0 0 7px;
  transform: translateY(4px);
  transition: transform 0.38s cubic-bezier(0.22,1,0.36,1), opacity 0.38s ease;
}
.committee-card:hover .card-type { transform: none; opacity: 1; }

.card-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(20px, 2.4vw, 30px);
  line-height: 1.1;
  color: #F5EFE7;
  margin: 0;
  transform: translateY(4px);
  transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
}
.committee-card:hover .card-title { transform: none; }

/* Card reveal */
.committee-card.reveal { transform: translateY(32px); opacity: 0; }
.committee-card.reveal.in-view { opacity: 1; transform: none; }
.committee-card.reveal.in-view:hover { transform: translateY(-8px) scale(1.015); }
.committee-card.reveal.in-view:active { transform: translateY(-4px) scale(1.008); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(2,2,4,0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 360ms ease;
  overflow-y: auto;
}
.modal-overlay.is-visible { opacity: 1; }

.modal-panel {
  position: relative;
  max-width: 820px;
  width: 100%;
  border-radius: 24px;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  max-height: min(90svh, 90vh);
  background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.12), 0 40px 100px rgba(0,0,0,0.75);
  transform: translateY(40px) scale(0.96);
  opacity: 0;
  transition: transform 460ms cubic-bezier(0.22,1,0.36,1), opacity 380ms ease;
  flex-shrink: 0;
}
.modal-overlay.is-visible .modal-panel {
  transform: none;
  opacity: 1;
}
/* Glass border */
.modal-panel::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px;
  background: linear-gradient(160deg, rgba(255,255,255,0.44) 0%, rgba(255,255,255,0.12) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,0.14) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none; z-index: 1;
}

/* Modal image */
.modal-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 8;
  overflow: hidden;
  border-radius: 24px 24px 0 0;
  flex-shrink: 0;
}
.modal-img-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.modal-img-ghost {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: clamp(90px, 16vw, 200px);
  color: rgba(212,168,83,0.08);
  user-select: none; line-height: 1; letter-spacing: -0.02em;
}

/* Close button */
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.65);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 200ms ease, color 200ms ease, transform 220ms cubic-bezier(0.22,1,0.36,1);
  z-index: 10;
}
.modal-close:hover { background: rgba(255,255,255,0.15); color: #fff; transform: scale(1.08) rotate(90deg); }

/* Modal body */
.modal-body { padding: clamp(24px,4vw,44px); }
.modal-type { font-family:'Barlow',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:#D4A853; margin:0 0 12px; opacity:0.88; }
.modal-title { font-family:'Instrument Serif',serif; font-style:italic; font-size:clamp(32px,5vw,58px); line-height:1; letter-spacing:-0.02em; color:#F5EFE7; margin:0 0 8px; }
.modal-subtitle { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(13px,1vw,15.5px); color:rgba(245,239,231,0.4); letter-spacing:0.06em; margin:0 0 clamp(22px,3.5vh,34px); }
.modal-rule { width:48px; height:1px; border:0; background:linear-gradient(90deg,#D4A853,transparent); margin:0 0 clamp(20px,3vh,30px); }

/* Modal topics */
.modal-topics { display:flex; flex-direction:column; gap:clamp(16px,2.5vh,24px); }
.modal-topic-item { display:flex; gap:clamp(14px,2.5vw,26px); align-items:flex-start; }
.modal-topic-label { font-family:'Barlow',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:0.24em; text-transform:uppercase; color:#D4A853; flex-shrink:0; padding-top:3px; min-width:56px; opacity:0.9; }
.modal-topic-text { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(15px,1.1vw,17.5px); line-height:1.78; color:rgba(245,239,231,0.76); margin:0; }

/* Modal description (Crisis drop cap) */
.modal-desc { font-family:'Barlow',sans-serif; font-weight:300; font-size:clamp(15px,1.1vw,17.5px); line-height:1.9; color:rgba(245,239,231,0.72); margin:0; text-wrap:pretty; }
.modal-desc::first-letter { font-family:'Instrument Serif',serif; font-style:italic; font-size:3.5em; line-height:0.78; float:left; margin:0.04em 0.14em 0 0; color:#D4A853; }

/* Content stagger in modal */
.modal-overlay.is-visible .modal-body > * {
  animation: modal-item-in 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
.modal-overlay.is-visible .modal-body > *:nth-child(1) { animation-delay: 120ms; }
.modal-overlay.is-visible .modal-body > *:nth-child(2) { animation-delay: 170ms; }
.modal-overlay.is-visible .modal-body > *:nth-child(3) { animation-delay: 210ms; }
.modal-overlay.is-visible .modal-body > *:nth-child(4) { animation-delay: 250ms; }
.modal-overlay.is-visible .modal-body > *:nth-child(5) { animation-delay: 290ms; }
@keyframes modal-item-in { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>

const DEVICE_TIER = (function detectTier() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 'low';
  const cores = navigator.hardwareConcurrency || 2;
  const mem = navigator.deviceMemory;
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const conn = navigator.connection;
  if (conn && (conn.saveData || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g')) return 'low';
  if (isMobile) return cores >= 6 ? 'mid' : 'low';
  if (mem !== undefined) {
    if (mem >= 8 && cores >= 8) return 'high';
    if (mem >= 4 || cores >= 6) return 'mid';
    return 'low';
  }
  return cores >= 8 ? 'high' : cores >= 4 ? 'mid' : 'low';
})();

// ── CommitteeModal ──
function CommitteeModal({ committee, onClose }) {
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setVisible(true), 12);
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') handleClose(); };
    document.addEventListener('keydown', onKey);
    return () => {
      clearTimeout(t);
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
    };
  }, []);

  const handleClose = () => {
    setVisible(false);
    setTimeout(onClose, 440);
  };

  return html`
    <div
      className=${"modal-overlay" + (visible ? " is-visible" : "")}
      onClick=${(e) => { if (e.target === e.currentTarget) handleClose(); }}
      role="dialog"
      aria-modal="true"
      aria-label=${committee.title}

      <div className="modal-panel">
        <button className="modal-close" onClick=${handleClose} aria-label="Close committee details">

function NavBar() {

            </a>

            <span className="mob-bar"></span><span className="mob-bar"></span><span className="mob-bar"></span>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
      <p className="footer-fine reveal" style=${{ transitionDelay:'0.22s' }}>JAGMUN III · September 19–20, 2026</p>
    </footer>
  `;
}

// ── App ──
function App() {
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    const els = Array.from(document.querySelectorAll('.reveal'));
    if (!els.length) return;
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(
        entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } }),
        { threshold: 0.08, rootMargin: '0px 0px -6% 0px' }
      );
      els.forEach(el => io.observe(el));
      return () => io.disconnect();
    }
  }, []);

  useEffect(() => {
    if (DEVICE_TIER === 'low') return;
    const L = window.Lenis; if (!L) return;
    const lenis = new L({ duration: DEVICE_TIER === 'high' ? 1.15 : 1.0, smoothWheel: true, wheelMultiplier: 0.9 });
    window.__jagLenis = lenis;
    let id; const raf = t => { lenis.raf(t); id = requestAnimationFrame(raf); };
    id = requestAnimationFrame(raf);
    return () => { cancelAnimationFrame(id); lenis.destroy(); window.__jagLenis = null; };
  }, []);

  const gaCommittees     = COMMITTEES.filter(c => c.section === 'general-assembly');
  const crisisCommittees = COMMITTEES.filter(c => c.section === 'crisis');

  return html`
    <div className="bg-black text-white overflow-x-hidden">
      <${NavBar} />

      <!-- Hero -->
      <div className="sec-hero">
        <div className="sec-hero-orb" aria-hidden="true"></div>
        ${DEVICE_TIER !== 'low' && html`
          <div className="sec-hero-particles" aria-hidden="true">
            ${PARTICLES.map((p, i) => html`
              <div key=${i} className="sec-hero-particle" style=${{ left:p.left, top:p.top, '--pdur':p.pdur, '--pdel':p.pdel, '--py':p.py, '--px':p.px, '--pop':p.pop }}></div>
            `)}
          </div>
        `}
        <p className="sec-hero-eyebrow">JAGMUN III · 2026</p>
        <h1 className="sec-hero-title">Committees</h1>
        <p className="sec-hero-sub">Click any committee to learn more</p>
        <div className="sec-hero-line" aria-hidden="true"></div>
      </div>

      <!-- Grid -->
      <div className="grid-section">
        <div className="grid-inner">

          <p id="general-assembly" className="grid-section-label reveal">General Assembly</p>
          <div className="committee-grid">
            ${gaCommittees.map((c, i) => html`
              <${CommitteeCard} key=${c.id} committee=${c} onOpen=${setSelected} delay=${0.08 + i * 0.1} />
            `)}
          </div>

          <p id="crisis" className="grid-section-label reveal" style=${{ scrollMarginTop: '120px' }}>Crisis Committee</p>
          <div className="committee-grid">
            ${crisisCommittees.map((c, i) => html`
              <${CommitteeCard} key=${c.id} committee=${c} onOpen=${setSelected} delay=${0.08 + i * 0.1} />
            `)}
          </div>

        </div>
      </div>

      <${SiteFooter} />

      <!-- Modal (rendered last so it sits above everything) -->
      ${selected && html`
        <${CommitteeModal} committee=${selected} onClose=${() => setSelected(null)} />
      `}
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
