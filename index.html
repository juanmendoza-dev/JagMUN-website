<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JAGMUN III</title>
<link rel="icon" type="image/png" href="assets/jagmun-logo.png" />

<!-- Production React (no dev-warning overhead, ~3x smaller than dev builds) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<!-- htm: ~800-byte JSX-without-Babel alternative (replaces the 1.5 MB Babel Standalone) -->

<!-- Tailwind utility classes -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lenis smooth scroll — deferred so it never blocks first paint -->
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
@font-face {
  font-family: 'Dirtyline';
  src: url('https://fonts.cdnfonts.com/s/15011/Dirtyline36DaysofType.woff') format('woff');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

html, body { background: #000; }
body { font-family: 'Barlow', sans-serif; }

.font-heading { font-family: 'Instrument Serif', serif; }
.font-body { font-family: 'Barlow', sans-serif; }
.font-dirtyline { font-family: 'Dirtyline', sans-serif; }

/* Override Tailwind's `rounded` to full pill */
.rounded { border-radius: 9999px !important; }

.liquid-glass {
  background: rgba(255,255,255,0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.45) 0%,
    rgba(255,255,255,0.15) 20%,
    rgba(255,255,255,0)    40%,
    rgba(255,255,255,0)    60%,
    rgba(255,255,255,0.15) 80%,
    rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

.liquid-glass-strong {
  background: rgba(255,255,255,0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(50px);
  -webkit-backdrop-filter: blur(50px);
  border: none;
  box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}
.liquid-glass-strong::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.5) 0%,
    rgba(255,255,255,0.2) 20%,
    rgba(255,255,255,0)   40%,
    rgba(255,255,255,0)   60%,
    rgba(255,255,255,0.2) 80%,
    rgba(255,255,255,0.5) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

.hero-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(96px, 18vw, 280px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  color: white;
  text-align: center;
}

.hero-date {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(22px, 2.4vw, 36px);
  line-height: 1;
  letter-spacing: 0.01em;
  color: rgba(255, 255, 255, 0.82);
  text-align: center;
  margin-top: 0.35em;
  text-shadow: 0 1px 24px rgba(0, 0, 0, 0.25);
}
.hero-date::before,
.hero-date::after {
  content: "";
  display: inline-block;
  width: clamp(28px, 4vw, 56px);
  height: 1px;
  background: rgba(255, 255, 255, 0.45);
  vertical-align: middle;
  margin: 0 0.8em;
  transform: translateY(-0.12em);
}

/* RGB / rainbow hover ring */
@property --rgb-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
.rgb-hover { position: relative; }
.rgb-hover::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.6px;
  background: conic-gradient(from var(--rgb-angle),
    #ff3b8b, #ff8a3d, #ffd166, #6dd76a, #4cc9f0, #8b5cf6, #ff3b8b);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
  z-index: 2;
}
.rgb-hover:hover::after {
  opacity: 1;
  animation: rgb-spin 3.2s linear infinite;
}
.rgb-hover:hover {
  box-shadow: 0 0 22px 2px rgba(140, 100, 255, 0.18),
              0 0 36px 8px rgba(255, 120, 180, 0.10);
}
@keyframes rgb-spin {
  to { --rgb-angle: 360deg; }
}

/* ---------- Loading screen ---------- */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: opacity 950ms cubic-bezier(0.4, 0, 0.2, 1);
  will-change: opacity;
  font-family: 'Barlow', sans-serif;
}
.loading-overlay.is-exiting {
  opacity: 0;
  pointer-events: none;
}
.loading-overlay.is-exiting .loading-stage {
  animation: stage-launch 1100ms cubic-bezier(0.7, 0, 0.2, 1) forwards;
}
@keyframes stage-launch {
  0%   { transform: translateY(0) scale(1); }
  100% { transform: translateY(-24vh) scale(0.72); }
}

.loading-stage {
  position: relative;
  display: inline-block;
  will-change: transform;
}

.loading-pre {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.32);
  opacity: 0;
  animation: pre-flash 1300ms ease-out forwards;
  pointer-events: none;
}
@keyframes pre-flash {
  0%   { opacity: 0; }
  35%  { opacity: 1; }
  100% { opacity: 0; }
}

.loading-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(80px, 16vw, 240px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: #F5EFE7;
  text-align: center;
  margin: 0;
  clip-path: inset(0 100% 0 0);
  filter: blur(10px);
  opacity: 0.8;
  animation: title-reveal 1800ms cubic-bezier(0.22, 1, 0.36, 1) 600ms forwards;
  position: relative;
  z-index: 2;
  white-space: nowrap;
}
@keyframes title-reveal {
  0%   { clip-path: inset(0 100% 0 0); filter: blur(10px); opacity: 0.8; }
  60%  { filter: blur(0); opacity: 1; }
  100% { clip-path: inset(0 0% 0 0); filter: blur(0); opacity: 1; }
}

/* Low-tier loading title: no clip-path (skip the animation, just fade in) */
.tier-low .loading-title {
  clip-path: none;
  filter: none;
  opacity: 0;
  animation: low-title-fade 600ms ease forwards;
}
@keyframes low-title-fade {
  to { opacity: 1; }
}

.loading-title.is-glitching {
  animation: title-glitch 180ms steps(4) 1;
}
@keyframes title-glitch {
  0%   { transform: translate(0,0); filter: none; }
  25%  { transform: translate(4px,-2px); filter: drop-shadow(-7px 0 0 rgba(141,36,36,.95)) drop-shadow(5px 0 0 rgba(255,255,255,.4)); }
  50%  { transform: translate(-3px,1px); filter: drop-shadow(6px 0 0 rgba(141,36,36,.9)); }
  75%  { transform: translate(2px,0); filter: drop-shadow(-3px 0 0 rgba(141,36,36,.6)); }
  100% { transform: translate(0,0); filter: none; }
}

.loading-glitch-bar {
  position: absolute;
  right: -4%;
  bottom: 36%;
  width: 38%;
  height: 10px;
  background: #8d2424;
  box-shadow: 14px 0 24px rgba(141, 36, 36, 0.55),
              -2px 0 0 rgba(141, 36, 36, 0.4);
  filter: blur(0.4px);
  opacity: 0;
  transform-origin: right;
  pointer-events: none;
  z-index: 3;
}
.loading-glitch-bar.is-on {
  animation: glitch-bar 200ms steps(4) 1;
}
@keyframes glitch-bar {
  0%   { opacity: 0; transform: scaleX(0); }
  20%  { opacity: 1; transform: scaleX(1) translateX(2%); }
  60%  { opacity: 1; transform: scaleX(0.85) translateX(-4%); }
  100% { opacity: 0; transform: scaleX(0.3) translateX(8%); }
}

.loading-bolt {
  position: absolute;
  left: 50%;
  top: 56%;
  transform: translate(-50%, -50%);
  width: 88%;
  height: 80%;
  pointer-events: none;
  opacity: 0;
  z-index: 1;
  overflow: visible;
}
.loading-bolt.is-on { opacity: 1; }
.loading-bolt.is-fading { animation: bolt-fade 900ms ease-out forwards; }
@keyframes bolt-fade { to { opacity: 0; } }
.loading-bolt path {
  stroke: #8d2424;
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1600;
  stroke-dashoffset: 1600;
  filter: drop-shadow(0 0 8px rgba(141,36,36,0.85))
          drop-shadow(0 0 18px rgba(141,36,36,0.45));
}
.loading-bolt.is-on path {
  animation: bolt-stroke 420ms linear forwards;
}
@keyframes bolt-stroke { to { stroke-dashoffset: 0; } }

.loading-sparkle {
  position: absolute;
  width: 22px; height: 22px;
  pointer-events: none;
  opacity: 0;
  transform: scale(0) rotate(15deg);
  z-index: 4;
  color: #F5EFE7;
}
.loading-sparkle.is-on {
  animation: sparkle-flash 320ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes sparkle-flash {
  0%   { transform: scale(0) rotate(0); opacity: 0; }
  45%  { transform: scale(1.3) rotate(20deg); opacity: 1; }
  100% { transform: scale(0) rotate(60deg); opacity: 0; }
}

.loading-skip {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(36, 36, 36, 0.92);
  color: #F5EFE7;
  border: none;
  border-radius: 999px;
  font: 500 11px/1 'Barlow', sans-serif;
  letter-spacing: 0.06em;
  padding: 8px 20px;
  cursor: pointer;
  opacity: 0;
  transition: background 200ms, color 200ms;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.loading-skip.is-on {
  animation: skip-in 320ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.loading-skip:hover {
  background: rgba(60, 60, 60, 0.95);
}
@keyframes skip-in {
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ---------- Nav dropdown menus ---------- */
.nav-trigger {
  position: relative;
}
.nav-trigger > .caret {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 6px;
  border-right: 1.2px solid currentColor;
  border-bottom: 1.2px solid currentColor;
  transform: translateY(-2px) rotate(45deg);
  opacity: 0.55;
  transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease;
}
.nav-trigger.is-open > .caret {
  transform: translateY(0) rotate(225deg);
  opacity: 1;
}

.nav-dropdown {
  position: absolute;
  top: 100%;
  padding: 14px 8px 8px;
  pointer-events: none;
  visibility: hidden;
  transform: translate3d(-50%, -4px, 0);
  opacity: 0;
  transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1),
              transform 280ms cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 280ms;
  z-index: 60;
  will-change: transform, opacity;
  backface-visibility: hidden;
}
.nav-dropdown.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate3d(-50%, 0, 0);
  transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1),
              transform 280ms cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 0s;
}

.nav-dropdown-card {
  position: relative;
  min-width: 220px;
  padding: 6px;
  border-radius: 16px;
  background: rgba(20, 20, 22, 0.72);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.12),
    0 12px 32px rgba(0,0,0,0.45),
    0 2px 6px rgba(0,0,0,0.25);
  overflow: hidden;
  transform: translateZ(0);
}
.nav-dropdown.is-open .nav-dropdown-card {
  background: rgba(20, 20, 22, 0.42);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
}
.nav-dropdown-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.2px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.5) 0%,
    rgba(255,255,255,0.18) 25%,
    rgba(255,255,255,0)    45%,
    rgba(255,255,255,0)    60%,
    rgba(255,255,255,0.18) 80%,
    rgba(255,255,255,0.5) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  pointer-events: none;
}

.nav-dropdown-item {
  position: relative;
  display: block;
  padding: 9px 16px;
  border-radius: 10px;
  font-family: 'Barlow', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.72);
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  opacity: 0;
  transform: translate3d(-6px, 0, 0);
  transition:
    background-color 180ms ease,
    color 180ms ease,
    opacity 280ms ease,
    transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform, opacity;
}
.nav-dropdown.is-open .nav-dropdown-item {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}
.nav-dropdown.is-open .nav-dropdown-item:nth-child(1) { transition-delay: 40ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(2) { transition-delay: 90ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(3) { transition-delay: 140ms; }
.nav-dropdown.is-open .nav-dropdown-item:nth-child(4) { transition-delay: 190ms; }

.nav-dropdown-item > span.lbl {
  display: inline-block;
  transform: translateX(0);
  transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}
.nav-dropdown-item:hover > span.lbl {
  transform: translateX(6px);
}
.nav-dropdown-item::after {
  content: "";
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translate3d(0, -50%, 0) scaleY(0.2);
  width: 2px;
  height: 14px;
  border-radius: 2px;
  background: #D4A853;
  opacity: 0;
  transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 0 8px rgba(212,168,83,0.55);
}
.nav-dropdown-item:hover {
  color: #fff;
  background-color: rgba(255,255,255,0.06);
}
.nav-dropdown-item:hover::after {
  opacity: 1;
  transform: translate3d(0, -50%, 0) scaleY(1);
}

/* ============================ Marquee separator ============================ */
.marquee {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #EFE7DA;
  padding: 15px 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(0,0,0,0.08);
  user-select: none;
}
.marquee-track {
  display: flex;
  width: max-content;
  animation: marquee-scroll 36s linear infinite;
  will-change: transform;
}
.marquee-group { display: flex; flex-shrink: 0; }
.marquee-item {
  display: inline-flex;
  align-items: center;
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  font-size: clamp(22px, 2.5vw, 34px);
  letter-spacing: 0.015em;
  text-transform: uppercase;
  color: #17181c;
  white-space: nowrap;
}
.marquee-star {
  color: #C2922B;
  margin: 0 0.62em;
  font-size: 0.62em;
  transform: translateY(-0.06em);
}
@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ============================ Dark Marquee separator ============================ */
.marquee-dark {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #07080c;
  padding: 18px 0;
  box-shadow:
    inset 0 1px 0 rgba(212,168,83,0.18),
    inset 0 -1px 0 rgba(212,168,83,0.12);
  user-select: none;
}
.marquee-dark-track {
  display: flex;
  width: max-content;
  animation: marquee-dark-scroll 48s linear infinite;
  will-change: transform;
}
@keyframes marquee-dark-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.marquee-dark-group { display: flex; flex-shrink: 0; }
.marquee-dark-item {
  display: inline-flex;
  align-items: center;
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(18px, 2vw, 28px);
  letter-spacing: 0.02em;
  color: #D4A853;
  white-space: nowrap;
  opacity: 0.88;
}
.marquee-dark-dot {
  margin: 0 0.9em;
  font-size: 0.5em;
  opacity: 0.55;
  transform: translateY(-0.1em);
  font-style: normal;
}

@media (prefers-reduced-motion: reduce) {
  .marquee-dark-track { animation: none !important; }
}

/* ======================= Letter from the Directors ======================= */
.letter-section {
  position: relative;
  z-index: 10;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(212,168,83,0.10) 0%, rgba(212,168,83,0) 55%),
    linear-gradient(180deg, #050507 0%, #0a0b0f 26%, #0a0b0f 100%);
  padding: clamp(96px, 14vh, 180px) 24px clamp(110px, 16vh, 200px);
}
.letter-inner {
  max-width: 880px;
  margin: 0 auto;
  text-align: center;
}
.letter-eyebrow {
  font-family: 'Barlow', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #D4A853;
  margin: 0 0 18px;
}
.letter-eyebrow::before { content: "\2726"; margin-right: 0.9em; font-size: 0.82em; opacity: 0.8; }
.letter-eyebrow::after  { content: "\2726"; margin-left: 0.9em; font-size: 0.82em; opacity: 0.8; }
.letter-heading {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(46px, 7vw, 92px);
  line-height: 1.02;
  letter-spacing: -0.015em;
  color: #F5EFE7;
  margin: 0;
}
.letter-card {
  position: relative;
  max-width: 760px;
  margin: clamp(44px, 6vh, 68px) auto 0;
  padding: clamp(34px, 5.2vw, 76px);
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.13), 0 34px 90px rgba(0,0,0,0.55);
  text-align: left;
}
.letter-card::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1.2px;
  background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 35%, rgba(255,255,255,0) 55%, rgba(255,255,255,0.16) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none;
}
.letter-greeting {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: clamp(24px, 3vw, 34px);
  color: #F5EFE7;
  margin: 0 0 26px;
}
.letter-body {
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
  font-size: clamp(15.5px, 1.15vw, 18px);
  line-height: 1.85;
  color: rgba(245,239,231,0.74);
  margin: 0 0 22px;
  text-wrap: pretty;
}
.letter-body--lead::first-letter {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 3.5em;
  line-height: 0.78;
  float: left;
  margin: 0.04em 0.14em 0 0;
  color: #D4A853;
}
.letter-rule {
  width: 56px; height: 1px;
  background: linear-gradient(90deg, #D4A853, rgba(212,168,83,0));
  border: 0; margin: 34px 0 22px;
}
.letter-sign-line {
  font-family: 'Barlow', sans-serif; font-weight: 300;
  font-size: 15px; color: rgba(245,239,231,0.6);
  margin: 0 0 6px; letter-spacing: 0.02em;
}
.letter-sign-name {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: clamp(24px, 2.6vw, 32px); color: #F5EFE7; margin: 0;
}
.letter-sign-role {
  font-family: 'Barlow', sans-serif; font-weight: 500;
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;

<script>
// ============================================================
// 1. DEVICE TIER DETECTION
// Runs synchronously so .tier-* class is on <body> before
// React renders, giving CSS the right overrides from frame 1.
// ============================================================
const DEVICE_TIER = (function detectTier() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 'low';

  const cores = navigator.hardwareConcurrency || 2;
  const mem   = navigator.deviceMemory; // Chrome only; undefined elsewhere
  const ua    = navigator.userAgent;
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(ua);

  // Honour data-saver / slow network
  const conn = navigator.connection;
  if (conn && (conn.saveData ||
      conn.effectiveType === 'slow-2g' ||
      conn.effectiveType === '2g')) return 'low';

  if (isMobile) {
    // Modern flagship phones have 6-8 cores — give them mid-tier.
    // Budget / mid-range phones stay low.
    return cores >= 6 ? 'mid' : 'low';
  }

  // Desktop / laptop heuristics
  if (mem !== undefined) {
    if (mem >= 8 && cores >= 8) return 'high'; // MacBook Pro, gaming rig, etc.
    if (mem >= 4 || cores >= 6) return 'mid';  // Average laptop, Chromebook
    return 'low';
  }
  // Fallback when deviceMemory is not reported (Firefox, Safari)
  if (cores >= 8) return 'high';
  if (cores >= 4) return 'mid';
  return 'low';
})();

document.body.classList.add('tier-' + DEVICE_TIER);

// ============================================================
// 2. htm SETUP  (replaces Babel Standalone)
// htm lets us write JSX-like template literals natively.
// ============================================================
const html = htm.bind(React.createElement);
const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

// ============================================================
// 3. CONFIG
// ============================================================
const NAV_ITEMS = [
  { label: 'SECRETARIAT', href: '/secretariat' },
  { label: 'SCHEDULE',    href: '#schedule' },
  { label: 'COMMITTEES',  items: ['ALL COMMITTEES', 'GENERAL ASSEMBLY', 'CRISIS'] },
];
const ITEM_HREFS = {
  'THE SECRETARIAT':     '/secretariat',
  'CONFERENCE SCHEDULE': '#schedule',
  'ALL COMMITTEES':      '/committees',
  'GENERAL ASSEMBLY':    '/committees#general-assembly',
  'SPECIALIZED':         '/committees#specialized',
  'CRISIS':              '/committees#crisis',
  'REGISTRATION':        'https://docs.google.com/forms/d/e/1FAIpQLSdSQx3ZYI0sBthYWoXN9pQKQ6hqGzLzRkRKu4CM7QMQka8F3Q/viewform?usp=publish-editor',
};

const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260422_191657_800d4e1f-7ab3-41af-90b6-9bd3039eb294.mp4';

// Per-tier video configuration
const VIDEO_CFG = {
  //          maxWidth  fps  maxFrames   preload
  high: { maxWidth: 1920, fps: 30, maxFrames: Infinity, preload: 'auto'     },
  mid:  { maxWidth: 960,  fps: 24, maxFrames: 80,       preload: 'metadata' },
  low:  { maxWidth: 0,    fps: 0,  maxFrames: 0,        preload: 'metadata' },
};
const vCfg = VIDEO_CFG[DEVICE_TIER];

// Per-tier loading-overlay timeline (ms from mount)
const OVERLAY_TIMELINE = {
  // Full cinematic sequence
  high: { showSkip: 1400, bolt: 2700, sparkleOn: 3400, sparkleOff: 3900,
          glitchOn: 3800, glitchOff: 4150, boltFade: 4500, exit: 6400 },
  // Same beats, compressed to ~half duration
  mid:  { showSkip: 800,  bolt: 1400, sparkleOn: 1800, sparkleOff: 2100,
          glitchOn: 2000, glitchOff: 2300, boltFade: 2400, exit: 3600 },
  // Just a quick title fade — no bolt / sparkle / glitch
  low:  { showSkip: 0,    bolt: 0,    sparkleOn: 0,    sparkleOff: 0,
          glitchOn: 0,    glitchOff: 0,    boltFade: 0,    exit: 1400 },
};
const OT = OVERLAY_TIMELINE[DEVICE_TIER];

// ============================================================
// 4. COMPONENTS
// ============================================================

// --- LoadingOverlay ---
function LoadingOverlay({ onDone }) {
  const [exiting,   setExiting]   = useState(false);
  const [showSkip,  setShowSkip]  = useState(DEVICE_TIER === 'low'); // show skip immediately on low
  const [boltState, setBoltState] = useState('off'); // 'off' | 'on' | 'fading'
  const [sparkleOn, setSparkleOn] = useState(false);
  const [glitchOn,  setGlitchOn]  = useState(false);
  const timersRef    = useRef([]);
  const doneCalledRef = useRef(false);

  const beginExit = useCallback(() => {
    if (doneCalledRef.current) return;
    doneCalledRef.current = true;
    timersRef.current.forEach(clearTimeout);
    setExiting(true);
    setTimeout(() => onDone && onDone(), 1100);
  }, [onDone]);

  useEffect(() => {
    const t = timersRef.current;

    if (DEVICE_TIER !== 'low') {
      if (OT.showSkip)   t.push(setTimeout(() => setShowSkip(true),        OT.showSkip));
      if (OT.bolt)       t.push(setTimeout(() => setBoltState('on'),        OT.bolt));
      if (OT.sparkleOn)  t.push(setTimeout(() => setSparkleOn(true),        OT.sparkleOn));
      if (OT.sparkleOff) t.push(setTimeout(() => setSparkleOn(false),       OT.sparkleOff));
      if (OT.glitchOn)   t.push(setTimeout(() => setGlitchOn(true),         OT.glitchOn));
      if (OT.glitchOff)  t.push(setTimeout(() => setGlitchOn(false),        OT.glitchOff));
      if (OT.boltFade)   t.push(setTimeout(() => setBoltState('fading'),    OT.boltFade));
    }

    t.push(setTimeout(beginExit, OT.exit));
    return () => t.forEach(clearTimeout);
  }, [beginExit]);

  const boltPath = "M 8 110 L 80 78 L 140 132 L 210 62 L 290 134 L 360 76 L 440 142 L 520 70 L 605 128 L 685 84 L 760 118 L 820 96";

  // Low tier: minimal overlay — just the wordmark fading in then out
  if (DEVICE_TIER === 'low') {
    return html`
      <div className=${"loading-overlay" + (exiting ? " is-exiting" : "")}>
        <div className="loading-stage">
          <h2 className="loading-title" aria-label="JAGMUN III">JAGMUN III</h2>
        </div>
        <button
          type="button"
          className="loading-skip is-on"
          onClick=${beginExit}
          aria-label="Skip intro"
        >Skip</button>
      </div>
    `;
  }

  // Mid / High tier: full sequence
  return html`
    <div className=${"loading-overlay" + (exiting ? " is-exiting" : "")}>
      <div className="loading-stage">
        <span className="loading-pre">Loading\u2026</span>

        <svg
          className=${"loading-bolt " + (boltState === 'on' ? 'is-on' : boltState === 'fading' ? 'is-fading is-on' : '')}
          viewBox="0 0 840 200"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path d=${boltPath} />
        </svg>

        <h2 className=${"loading-title" + (glitchOn ? ' is-glitching' : '')} aria-label="JAGMUN III">
          JAGMUN III
        </h2>

        <div className=${"loading-glitch-bar" + (glitchOn ? ' is-on' : '')} aria-hidden="true"></div>

        <svg
          className=${"loading-sparkle" + (sparkleOn ? ' is-on' : '')}
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
          style=${{ top: '8%', left: '64%' }}
        >
          <path d="M12 0 L13.4 10.6 L24 12 L13.4 13.4 L12 24 L10.6 13.4 L0 12 L10.6 10.6 Z" />
        </svg>
      </div>

      <button
        type="button"
        className=${"loading-skip" + (showSkip ? ' is-on' : '')}
        onClick=${beginExit}
        aria-label="Skip intro"
      >Skip</button>
    </div>
  `;
}

// --- NavBar ---
function NavBar() {
  const [openIdx,   setOpenIdx]  = useState(null);
  const [positions, setPositions] = useState([]);
  const [menuOpen,  setMenuOpen]  = useState(false);
  const navRef      = useRef(null);
  const triggerRefs = useRef([]);
  const closeTimer  = useRef(null);

  // Lock body scroll when mobile menu is open
  useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);

  const measurePositions = useCallback(() => {
    if (!navRef.current) return;
    const navRect = navRef.current.getBoundingClientRect();
    const xs = NAV_ITEMS.map((_, i) => {
      const el = triggerRefs.current[i];
      if (!el) return 0;
      const r = el.getBoundingClientRect();
      return r.left + r.width / 2 - navRect.left;
    });
    setPositions(xs);
  }, []);

  useLayoutEffect(() => {
    measurePositions();
    window.addEventListener('resize', measurePositions);
    const f = setTimeout(measurePositions, 600);
    return () => {
      window.removeEventListener('resize', measurePositions);
      clearTimeout(f);
    };

// ============================================================
// 5. APP — wires everything together
// ============================================================
function App() {
  const [loading,     setLoading]     = useState(true);
  const [mounted,     setMounted]     = useState(false);
  const [framesReady, setFramesReady] = useState(false);

  const videoRef       = useRef(null);
  const displayCanvasRef = useRef(null);
  const framesRef      = useRef([]);
  const lenisRef       = useRef(null);

  // Fade in the hero once the loading overlay is gone
  useEffect(() => {
    if (loading) return;
    const t = setTimeout(() => setMounted(true), 50);
    return () => clearTimeout(t);
  }, [loading]);

  // Effect 1 — frame capture for boomerang (high / mid only)
  useEffect(() => {
    if (vCfg.maxFrames === 0) return; // low tier: skip entirely

    const video = videoRef.current;
    if (!video) return;

    let capturing = true;
    let lastTime  = -1;
    const frames  = [];
    let rafId = null;
    let vfcId = null;

    const captureFrame = () => {
      if (!capturing) return;
      if (video.readyState < 2)             { scheduleNext(); return; }
      if (video.currentTime === lastTime)   { scheduleNext(); return; }

      // Stop once we've hit the frame cap (saves memory on mid tier)
      if (frames.length >= vCfg.maxFrames) {
        capturing = false;
        framesRef.current = frames;
        setFramesReady(true);
        return;
      }

      lastTime = video.currentTime;
      const scale = Math.min(1, vCfg.maxWidth / video.videoWidth);
      const w = Math.max(1, Math.floor(video.videoWidth  * scale));
      const h = Math.max(1, Math.floor(video.videoHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width  = w;
      canvas.height = h;
      try {
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
        frames.push(canvas);
      } catch (e) {
        // CORS / tainted canvas — bail out
        capturing = false;
        return;
      }
      scheduleNext();
    };

    const scheduleNext = () => {
      if (!capturing) return;
      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        vfcId = video.requestVideoFrameCallback(captureFrame);
      } else {
        rafId = requestAnimationFrame(captureFrame);
      }
    };

    const onLoaded = () => { video.play().catch(() => {}); scheduleNext(); };
    const onEnded  = () => {
      capturing = false;
      framesRef.current = frames;
      if (frames.length > 0) setFramesReady(true);
    };

    video.addEventListener('loadedmetadata', onLoaded);
    video.addEventListener('ended', onEnded);
    if (video.readyState >= 1) onLoaded();

    return () => {
      capturing = false;
      if (rafId) cancelAnimationFrame(rafId);
      video.removeEventListener('loadedmetadata', onLoaded);
      video.removeEventListener('ended', onEnded);
    };
  }, []);

  // Effect 2 — boomerang render loop (high / mid only)
  useLayoutEffect(() => {
    if (!framesReady) return;
    const canvas = displayCanvasRef.current;
    const frames = framesRef.current;
    if (!canvas || frames.length === 0) return;

    const dpr = window.devicePixelRatio || 1;

    const sizeCanvas = () => {
      const w = canvas.parentElement ? canvas.parentElement.clientWidth  : window.innerWidth;
      const h = canvas.parentElement ? canvas.parentElement.clientHeight : window.innerHeight;
      canvas.width  = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    };
    sizeCanvas();

    // Cover-crop: fill canvas without CSS object-fit (GPU-side crop)
    const drawCover = (img) => {
      const cw = canvas.width, ch = canvas.height;
      const ir = img.width / img.height;
      const cr = cw / ch;
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (ir > cr) { sw = img.height * cr; sx = (img.width - sw) / 2; }
      else         { sh = img.width  / cr; sy = (img.height - sh) / 2; }
      canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    };

    // Paint first frame immediately so the canvas is never blank when revealed
    drawCover(frames[0]);

    let index     = 0;
    let direction = 1;
    let last      = performance.now();
    const interval = 1000 / vCfg.fps;
    let rafId;

    const render = (now) => {
      if (now - last >= interval) {
        last = now;
        drawCover(frames[index]);
        index += direction;
        if (index >= frames.length - 1) { index = frames.length - 1; direction = -1; }
        else if (index <= 0)            { index = 0;                   direction =  1; }
      }
      rafId = requestAnimationFrame(render);
    };
    rafId = requestAnimationFrame(render);

    window.addEventListener('resize', sizeCanvas);
    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', sizeCanvas);
    };
  }, [framesReady]);

  // Effect 3 — Lenis smooth scroll (skip on low tier)
  useEffect(() => {
    if (loading || DEVICE_TIER === 'low') return;
    const L = window.Lenis;
    if (!L) return;
    // High tier: slightly more inertia; mid tier: snappier
    const duration = DEVICE_TIER === 'high' ? 1.15 : 1.0;
    const lenis = new L({ duration, smoothWheel: true, wheelMultiplier: 0.9 });
    lenisRef.current = lenis;
    window.__jagLenis = lenis;
    let id;
    const raf = (t) => { lenis.raf(t); id = requestAnimationFrame(raf); };
    id = requestAnimationFrame(raf);
    return () => { cancelAnimationFrame(id); lenis.destroy(); lenisRef.current = null; window.__jagLenis = null; };
  }, [loading]);

  // Effect 4 — scroll reveal via IntersectionObserver (with rAF fallback)
  useEffect(() => {
    const els = Array.from(document.querySelectorAll('.reveal'));
    if (els.length === 0) return;

    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              io.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -8% 0px' }
      );
      els.forEach((el) => io.observe(el));
      return () => io.disconnect();
    }

    // Fallback for very old browsers
    let frame;
    const check = () => {
      const vh = window.innerHeight;
      els.forEach((el) => {
        if (el.classList.contains('in-view')) return;
        const r = el.getBoundingClientRect();
        if (r.top < vh * 0.88 && r.bottom > 0) el.classList.add('in-view');
      });
    };
    const onScroll = () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(check); };
    check();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { cancelAnimationFrame(frame); window.removeEventListener('scroll', onScroll); };
  }, [loading]);

  const goToLetter = useCallback(() => {
    const el = document.getElementById('letter');
    if (!el) return;
    if (lenisRef.current) {
      lenisRef.current.scrollTo(el, { duration: 1.35 });
    } else {
      window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset, behavior: 'smooth' });
    }
  }, []);

  // For low tier the video plays straight through (no boomerang canvas needed).
  // For high/mid, the canvas takes over once frames are ready.
  const showVideo  = DEVICE_TIER === 'low' || !framesReady;
  const showCanvas = DEVICE_TIER !== 'low' && framesReady;

  return html`
    <div className="bg-black text-white font-body overflow-x-hidden">
      ${loading && html`<${LoadingOverlay} onDone=${() => setLoading(false)} />`}

      <${NavBar} />

      <!-- ========================= HERO ========================= -->
      <section className="relative w-full overflow-hidden" style=${{ height: '100vh' }}>

        <!-- Video / canvas background -->
        <div
          className="absolute inset-0 z-0"
          style=${{ overflow: 'hidden', opacity: mounted ? 1 : 0, transition: 'opacity 1s ease' }}
        >
          <video
            ref=${videoRef}
            src=${VIDEO_SRC}
            muted
            playsInline
            autoPlay=${DEVICE_TIER === 'low'}
            loop=${DEVICE_TIER === 'low'}
            preload=${vCfg.preload}
            crossOrigin="anonymous"
            style=${{ display: showVideo ? 'block' : 'none', width: '100%', height: '100%', objectFit: 'cover' }}
          ></video>

          ${DEVICE_TIER !== 'low' && html`
            <canvas
              ref=${displayCanvasRef}
              style=${{ display: showCanvas ? 'block' : 'none', width: '100%', height: '100%' }}
            ></canvas>
          `}
        </div>

        <!-- Hero title -->
        <div
          className=${"absolute left-0 right-0 z-20 w-full px-4 transition-all duration-1000 " +
            (mounted ? "opacity-100 translate-y-0" : "opacity-0 translate-y-6")}
          style=${{ top: '126px' }}
        >
          <h1 className="hero-title select-none">JAGMUN III</h1>
          <p className="hero-date select-none">Sep 19\u201320, 2026</p>
        </div>

        <!-- Bottom row: CTA buttons -->
        <div
          className=${"absolute bottom-12 left-0 right-0 px-10 flex items-end justify-between z-20 transition-all duration-1000 delay-300 " +
            (mounted ? "opacity-100 translate-y-0" : "opacity-0 translate-y-6")}
        >
          <p className="text-sm font-body font-light text-white/75 max-w-[220px] leading-relaxed"></p>

          <div className="hero-cta-row absolute left-1/2 -translate-x-1/2 bottom-0 flex items-center gap-3">
            <a
              href="https://docs.google.com/forms/d/e/1FAIpQLSdSQx3ZYI0sBthYWoXN9pQKQ6hqGzLzRkRKu4CM7QMQka8F3Q/viewform?usp=publish-editor"
              target="_blank"
              rel="noopener noreferrer"
              className="rgb-hover group relative bg-white text-black text-sm font-body font-medium rounded px-6 py-3 overflow-hidden active:scale-[0.97] transition-all duration-200 hover:scale-[1.03]"
            >
              <span className="relative z-10">Registration</span>
              <span className="absolute inset-0 bg-gradient-to-b from-white to-white/85 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></span>
            </a>
            <a
              href="/committees"
              className="liquid-glass group text-white text-sm font-body font-medium rounded px-6 py-3 active:scale-[0.97] transition-all duration-200 hover:scale-[1.03] hover:shadow-[inset_0_1px_1px_rgba(255,255,255,0.2),0_0_20px_2px_rgba(255,255,255,0.07)]"
            >Committees</a>
          </div>

          <p className="text-sm font-body font-light text-white/75 max-w-[220px] leading-relaxed text-right"></p>
        </div>

        <!-- Scroll cue -->
        <button
          type="button"
          className="hero-scroll-cue"
          onClick=${goToLetter}
          aria-label="Scroll to the letter from the directors"
          style=${{ opacity: mounted ? 1 : 0, transition: 'opacity 1s ease 0.6s' }}
        >
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>
      </section>

      <!-- ===================== MARQUEE ===================== -->
      <${Marquee} />

      <!-- ================ LETTER FROM DIRECTORS ================ -->
      <${LetterSection} />

      <!-- ================ DARK MARQUEE DIVIDER ================ -->
      <${DarkMarquee} />

      <!-- ================ CONFERENCE SCHEDULE ================ -->
      <${ConferenceSchedule} />

      <!-- ==================== FOOTER ==================== -->
      <${SiteFooter} />
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
